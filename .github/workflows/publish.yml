name: Publish to PyPI

# Runs on every push to main but only releases when the package version
# (pyproject.toml, setup.py and cocomon/__init__.py) is not on PyPI yet, so
# bumping the version is what ships a release. After the upload it creates the
# v<version> tag and GitHub release. PyPI trusts this workflow via OIDC, so no
# API token is stored.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.pypi.outputs.publish }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "setup.py": re.search(r'version="([^"]+)"', open("setup.py").read()).group(1),
              "cocomon/__init__.py": re.search(r'__version__ = "([^"]+)"', open("cocomon/__init__.py").read()).group(1),
          }
          if len(set(versions.values())) != 1:
              sys.exit(f"Package versions disagree: {versions}")
          version = versions["pyproject.toml"]
          print(f"Package version: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
          EOF

      - name: Check PyPI
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cocomon/$VERSION/json")
          case "$status" in
            200) echo "cocomon $VERSION is already on PyPI"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "cocomon $VERSION is not on PyPI yet"; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected PyPI response: HTTP $status"; exit 1 ;;
          esac

      - name: Check GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub release v$VERSION does not exist yet"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true' || needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cocomon/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: [check, build, publish]
    # Also runs when publish was skipped because an earlier run already uploaded.
    if: >-
      !cancelled()
      && needs.check.outputs.release == 'true'
      && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Use this version's CHANGELOG.md section as the release notes.
          awk -v v="$VERSION" '/^## \[/{found = index($0, "[" v "]") > 0; next} found' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" "${notes[@]}"
